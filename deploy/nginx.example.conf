# timenote — Nginx 反代示例（仅供参考）
#
# 项目本身不配置、不部署 Nginx 或 SSL。
# 本文件只给开源用户作参考；证书、域名、站点启用方式均由部署方自理。
# 请按实际发行版放到 sites-available / conf.d 等，并自行 nginx -t && reload。
#
# 上游对应当前仓库 compose.yml 已暴露端口：
#   127.0.0.1:8720  → 单容器 app（Web + 同源 /api 反代）
#
# 若你将来拆成多容器（见 docs/deployment-compose-multi.md），可改用文末注释中的分流示例。

upstream timenote_app {
    server 127.0.0.1:8720;
}

server {
    listen 80;
    server_name cal.example.com;   # 改成你的域名

    # 若用 Let's Encrypt HTTP-01，保留此段；否则可删
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;     # 路径由部署方自定
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name cal.example.com;   # 改成你的域名

    # 证书路径由部署方自理（本仓库不提供、不申请证书）
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # API：禁止缓存（与 docs/deployment.md 一致）
    location /api/ {
        proxy_pass http://timenote_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header If-None-Match $http_if_none_match;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        add_header Cache-Control "private, no-cache" always;
    }
    location / {
        proxy_pass http://timenote_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header If-None-Match $http_if_none_match;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # 可选：业务健康（经反代）
    # location = /api/health {
    #     proxy_pass http://timenote_app;
    # }
}

